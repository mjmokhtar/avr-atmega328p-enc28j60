; PlatformIO project: ENC28J60 TCP/UDP stack, pure AVR-C, tanpa Arduino framework.
;
; board = uno artinya definisi HARDWARE-nya Arduino Uno (fuses, upload
; lewat bootloader USB-serial seperti biasa) - ini cuma soal flashing,
; TIDAK sama dengan pakai Arduino framework.
;
; framework kosong ("") artinya PlatformIO TIDAK menyertakan Arduino core
; (tidak ada pinMode/digitalWrite/millis() bawaan Arduino) - semua kode
; kita tulis sendiri pure AVR-C di lib/enc28j60_net + src/main.c (main()
; sendiri, bukan setup()/loop()). Upload tetap jalan normal karena itu
; urusan bootloader/board, bukan framework.

[env:uno]
platform = atmelavr
board = uno
framework =

; Board "uno" SUDAH otomatis set F_CPU=16000000UL dan upload_protocol=
; arduino lewat definisi board-nya sendiri. Sengaja TIDAK didefinisikan
; ulang di sini lewat build_flags - kalau didobel, avr-gcc keluarin
; warning "F_CPU redefined" (harmless, tapi berisik di log build).

upload_protocol = arduino
; upload_port = /dev/ttyUSB0  ; isi manual kalau auto-detect PlatformIO gagal

; Matikan LTO (Link-Time Optimization). Board "uno" (mode release) pakai
; -flto secara default, tapi kombinasi LTO + library custom kita
; (lib/enc28j60_net, di-archive jadi .a) bikin linker gagal nemu simbol
; yang sebenarnya ada ("undefined reference" ke HAMPIR SEMUA fungsi kita,
; padahal .o-nya sukses di-compile) - avr-toolchain-nya pakai `ar` biasa
; buat archive, bukan `gcc-ar` yang paham isi LTO. Ini bukan bug di kode
; kita, tapi ketidakcocokan LTO + static-library archiving di toolchain
; AVR PlatformIO. Matikan saja, gak butuh LTO buat project sekecil ini.
build_unflags = -flto